version: 2

models:
  - name: gold_category_paths
    description: One row per category with its full taxonomy path and depth.
    columns:
      - name: id
        data_tests: [unique, not_null]
      - name: path
        data_tests: [unique, not_null]
      - name: depth
        data_tests: [not_null]

  - name: gold_category_ancestors
    description: >-
      Closure table: every category paired with itself and each ancestor up
      to the taxonomy root. One row per (category_id, ancestor_id) pair.
    columns:
      - name: category_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('silver_categories')
                field: id
      - name: ancestor_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('silver_categories')
                field: id

  - name: gold_category_rollups
    description: >-
      One row per taxonomy category (every level), aggregating every
      categorized, non-transfer line item (gold_line_items) assigned to that
      category or any descendant. Every category has a row, zeroed out if
      nothing rolled up to it.
    columns:
      - name: category_id
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('silver_categories')
                field: id
      - name: parent_id
        description: NULL for a root category — ready for a Plotly sunburst's ids/parents/values shape.
        data_tests:
          - relationships:
              arguments:
                to: ref('silver_categories')
                field: id
      - name: path
        data_tests: [unique, not_null]
      - name: transaction_count
        description: Count of line items rolled up (a split counts on its own, not its parent transaction).
        data_tests: [not_null]
      - name: total_outflow
        data_tests: [not_null]
      - name: total_inflow
        data_tests: [not_null]
      - name: net_amount
        data_tests: [not_null]

  - name: gold_line_items
    description: >-
      One row per real spend/income event at the finest granularity
      available — a split (product_name) when a transaction was decomposed
      by the Amazon cascade, else the whole transaction. category_id is NULL
      until some cascade stage categorizes it.
    columns:
      - name: line_item_id
        data_tests: [unique, not_null]
      - name: transaction_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('silver_transactions')
                field: transaction_id
      - name: amount
        data_tests: [not_null]
      - name: posted_on
        data_tests: [not_null]

  - name: gold_monthly_flow
    description: >-
      Net cash flow by calendar month across every non-transfer transaction.
      Powers the Phase 6 overview dashboard's spend-over-time chart.
    columns:
      - name: month
        data_tests: [unique, not_null]
      - name: total_outflow
        data_tests: [not_null]
      - name: total_inflow
        data_tests: [not_null]
      - name: net_amount
        data_tests: [not_null]
      - name: transaction_count
        data_tests: [not_null]

  - name: gold_budget_actuals
    description: >-
      Budget vs. actual: one row per (budget, period bucket), aggregating
      real outflow across the budget's whole category subtree at the
      budget's own cadence (weekly/monthly/quarterly/yearly).
    columns:
      - name: budget_id
        data_tests: [not_null]
      - name: category_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('silver_categories')
                field: id
      - name: period_start
        data_tests: [not_null]
      - name: budgeted_amount
        data_tests: [not_null]
      - name: actual_outflow
        data_tests: [not_null]

  - name: gold_recurring_expenses
    description: >-
      Heuristically detected recurring charges: one row per (merchant_name,
      amount) pair of outflows that repeat at a regular weekly/monthly/
      quarterly/yearly cadence (rent, subscriptions, ...). A merchant charged
      the same amount only once or twice, or at irregular intervals, has no
      row here. Phase 7 (Intelligence).
    columns:
      - name: recurring_expense_id
        data_tests: [unique, not_null]
      - name: merchant_name
        data_tests: [not_null]
      - name: amount
        description: Positive charge magnitude (outflow), matching gold_monthly_flow's sign convention.
        data_tests: [not_null]
      - name: cadence
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [weekly, monthly, quarterly, yearly]
      - name: occurrence_count
        description: Number of charges observed; always >= 3 by construction.
        data_tests: [not_null]
      - name: first_seen_on
        data_tests: [not_null]
      - name: last_seen_on
        data_tests: [not_null]
      - name: avg_gap_days
        description: Average days between consecutive charges; the value cadence is bucketed from.
        data_tests: [not_null]
      - name: gap_days_stddev
        description: Population stddev of the gaps; always <= avg_gap_days * recurring_regularity_threshold.
        data_tests: [not_null]

  - name: gold_forecasts
    description: >-
      Spend/income forecasts (Phase 7), one row per (series, forecast month).
      predicted_amount = committed_amount + variable_amount; the interval
      covers the variable component only, since committed (recurring) spend is
      known rather than estimated. Empty until `pf forecast` has run, and
      series with under six complete months of history are deliberately absent
      rather than guessed at.
    columns:
      - name: forecast_id
        data_tests: [unique, not_null]
      - name: series_kind
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [total_inflow, total_outflow, budget_category]
      - name: series_key
        data_tests: [not_null]
      - name: series_label
        data_tests: [not_null]
      - name: category_id
        description: NULL for the two total series; a budget's category for budget_category rows.
        data_tests:
          - relationships:
              arguments:
                to: ref('silver_categories')
                field: id
      - name: period_start
        description: First day of the forecast month.
        data_tests: [not_null]
      - name: horizon
        description: Months ahead of trained_through; 1 is the next month.
        data_tests: [not_null]
      - name: committed_amount
        description: Recurring charges due that month, projected forward deterministically.
        data_tests: [not_null]
      - name: variable_amount
        description: Statistically modelled discretionary component.
        data_tests: [not_null]
      - name: predicted_amount
        data_tests: [not_null]
      - name: lower_bound
        data_tests: [not_null]
      - name: upper_bound
        data_tests: [not_null]
      - name: interval_level
        description: Interval coverage in percent (e.g. 80).
        data_tests: [not_null]
      - name: model_name
        description: Which candidate won the rolling-origin backtest for this series.
        data_tests: [not_null]
      - name: mase
        description: Backtest error vs. naive; below 1 means the model beat a naive forecast.
      - name: trend
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [rising, falling, flat]
      - name: trained_through
        description: Last COMPLETE month used to fit; the partial current month is excluded.
        data_tests: [not_null]

  - name: gold_sankey_flow
    description: >-
      Money-flow edges (source, target, value) for the Phase 6 Sankey
      diagram: income -> account, and account -> top-level category subtree.
    columns:
      - name: stage
        data_tests:
          - accepted_values:
              arguments:
                values: ["income", "spend"]
      - name: source_node
        data_tests: [not_null]
      - name: target_node
        data_tests: [not_null]
      - name: value
        data_tests: [not_null]
