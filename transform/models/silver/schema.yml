version: 2

models:
  - name: silver_transactions
    description: >-
      Cleaned, deduplicated transactions unioned across every ingested source
      (one row per logical transaction, keyed by transaction_id = bronze row_hash).
    columns:
      - name: transaction_id
        description: Stable per-transaction id (bronze row_hash); the grain.
        data_tests: [unique, not_null]
      - name: source
        data_tests: [not_null]
      - name: account_name
        data_tests: [not_null]
      - name: account_type
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - checking
                  - savings
                  - credit_card
                  - cash
                  - payment_app
                  - investment
                  - loan
                  - other
      - name: currency
        data_tests: [not_null]
      - name: posted_on
        data_tests: [not_null]
      - name: amount
        data_tests: [not_null]
      - name: flow
        description: Derived direction — outflow when amount < 0, else inflow.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [inflow, outflow]
      - name: merchant_name
        description: >-
          Cleaned merchant key from the raw descriptor: generic cleanup
          (normalize_merchant macro), then config-driven alias resolution
          (merchant_aliases, seeded from merchants.yaml), then human-confirmed
          embedding-similarity merges (merchant_merges); NULL only when the
          raw description is blank.
        data_tests:
          - relationships:
              arguments:
                to: ref('silver_merchants')
                field: merchant_name
      - name: is_transfer
        description: >-
          True when this row is a leg of a detected inter-account transfer
          (silver_transfers); spend/income measures should exclude these.
        data_tests: [not_null]

  - name: silver_transfers
    description: >-
      Detected inter-account transfers — one row per matched (outflow, inflow)
      pair of transactions that move money between the user's own accounts.
    columns:
      - name: transfer_id
        data_tests: [unique, not_null]
      - name: outflow_id
        description: The paying (negative) leg; matched 1:1, so unique here.
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('silver_transactions')
                field: transaction_id
      - name: inflow_id
        description: The receiving (positive) leg; matched 1:1, so unique here.
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('silver_transactions')
                field: transaction_id
      - name: from_account
        data_tests: [not_null]
      - name: to_account
        data_tests: [not_null]
      - name: amount
        data_tests: [not_null]
      - name: name_match
        description: True when a leg's descriptor names the counterparty account.
        data_tests: [not_null]
      - name: confidence
        description: high when name-corroborated, else medium (amount + date only).
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [high, medium]

  - name: silver_transaction_categories
    description: >-
      Stage 1 (rules) of the categorization cascade — one row per transaction
      that a config rule matched. A transaction absent here is uncategorized by
      this stage; later cascade stages pick up the remainder.
    columns:
      - name: transaction_id
        description: >-
          One row per matched transaction; absent = not matched by any rule.
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('silver_transactions')
                field: transaction_id
      - name: category_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('silver_categories')
                field: id
      - name: rule_id
        data_tests: [not_null]
      - name: categorization_source
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [rule, embedding, llm, human]
      - name: categorization_confidence
        data_tests: [not_null]

  - name: silver_transaction_categories_embedding
    description: >-
      Stage 2 (embedding similarity) of the categorization cascade — one row
      per transaction whose merchant matched a rule-categorized merchant by
      cosine similarity above the confidence threshold. Candidacy is
      transaction-level: only covers transactions stage 1 missed, even if
      other transactions of the same merchant were rule-matched (e.g. via an
      account_name/source rule rather than merchant_name).
    columns:
      - name: transaction_id
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('silver_transactions')
                field: transaction_id
      - name: category_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('silver_categories')
                field: id
      - name: categorization_source
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [rule, embedding, llm, human]
      - name: categorization_confidence
        data_tests: [not_null]

  - name: silver_transaction_categories_llm
    description: >-
      Stage 3 (local-LLM fallback) of the categorization cascade — one row per
      transaction whose merchant a local Ollama chat model classified with
      confidence above the threshold. Only covers merchants stages 1-2 missed
      entirely.
    columns:
      - name: transaction_id
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('silver_transactions')
                field: transaction_id
      - name: category_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('silver_categories')
                field: id
      - name: categorization_source
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [rule, embedding, llm, human]
      - name: categorization_confidence
        data_tests: [not_null]

  - name: silver_transaction_categories_human
    description: >-
      The human-review stage of the categorization cascade — corrections
      recorded via `pf review label`. The highest-priority stage: it can
      override an earlier stage's assignment, not just fill a gap. A
      transaction corrected more than once keeps only its latest label.
    columns:
      - name: transaction_id
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('silver_transactions')
                field: transaction_id
      - name: category_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('silver_categories')
                field: id
      - name: categorization_source
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [rule, embedding, llm, human]
      - name: categorization_confidence
        data_tests: [not_null]

  - name: silver_transaction_categories_all
    description: >-
      Every transaction categorized so far, across every cascade stage
      (human corrections, then rules + embedding similarity + local-LLM
      fallback) — the union PLAN.md's Phase 4 demo checks. Absent = not yet
      categorized by any stage.
    columns:
      - name: transaction_id
        description: One row per categorized transaction, across all stages.
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('silver_transactions')
                field: transaction_id
      - name: category_id
        data_tests: [not_null]
      - name: categorization_source
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [rule, embedding, llm, human]
      - name: categorization_confidence
        data_tests: [not_null]

  - name: silver_merchants
    description: >-
      Merchant dimension — one row per distinct cleaned merchant_name, derived
      from silver_transactions.
    columns:
      - name: merchant_id
        description: Deterministic hash of merchant_name; stable across runs.
        data_tests: [unique, not_null]
      - name: merchant_name
        data_tests: [unique, not_null]
      - name: transaction_count
        data_tests: [not_null]

  - name: silver_amazon_shipments
    description: >-
      One row per Amazon shipment — matching card-charge granularity, not per
      order or per line item (docs/source-schemas.md's matching note): a
      multi-item order shipped in two boxes produces two separate card
      charges. Order↔charge matching (silver_amazon_order_matches) and split
      decomposition (a later Phase 5 stage) are built on top of this model.
    columns:
      - name: website_order_id
        data_tests: [not_null]
      - name: ship_date
        data_tests: [not_null]
      - name: order_date
        data_tests: [not_null]
      - name: total_owed
        description: The shipment-level charge amount (repeated per item row upstream, taken once here).
        data_tests: [not_null]
      - name: items_subtotal
        description: Sum of this shipment's item subtotals (pre-tax).
        data_tests: [not_null]
      - name: item_count
        data_tests: [not_null]

  - name: silver_amazon_order_matches
    description: >-
      One row per matched (Amazon shipment, card charge) pair — deterministic
      amount + date matching, same shape as silver_transfers. Split
      decomposition (silver_amazon_splits) is built on top of this model.
    columns:
      - name: order_match_id
        data_tests: [unique, not_null]
      - name: website_order_id
        description: >-
          The matched shipment's order id — not unique alone (an order that
          ships in two boxes has two shipments, hence two rows here); the
          (website_order_id, ship_date) pair matches 1:1 to one transaction_id.
        data_tests: [not_null]
      - name: ship_date
        data_tests: [not_null]
      - name: transaction_id
        description: The matched card charge; unique here since matching is 1:1.
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('silver_transactions')
                field: transaction_id
      - name: total_owed
        data_tests: [not_null]
      - name: day_gap
        description: Absolute days between ship_date and the charge's posted_on.
        data_tests: [not_null]

  - name: silver_amazon_splits
    description: >-
      Transaction decomposition into splits (docs/ARCHITECTURE.md's
      transaction_splits concept), keyed off matched Amazon order line items —
      only matched shipments decompose here. Line items are allocated
      proportionally to their (subtotal + tax) share of the transaction's
      amount, with the last item (by split_id) absorbing the rounding
      remainder, so splits sum to exactly the transaction amount per
      transaction_id (assert_amazon_splits_sum_to_transaction_amount).
    columns:
      - name: split_id
        data_tests: [unique, not_null]
      - name: transaction_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('silver_transactions')
                field: transaction_id
      - name: asin
        data_tests: [not_null]
      - name: quantity
        data_tests: [not_null]
      - name: amount
        description: This split's share of the transaction amount (same sign convention).
        data_tests: [not_null]

  - name: silver_split_categories
    description: >-
      Stage 1 (rules) of the split-categorization cascade — the same
      rules-based approach used for transactions (silver_transaction_categories),
      applied to silver_amazon_splits.product_name instead of merchant_name. A
      split absent here is uncategorized by this stage; later cascade stages
      pick up the remainder.
    columns:
      - name: split_id
        description: One row per matched split; absent = not matched by any product_name rule.
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('silver_amazon_splits')
                field: split_id
      - name: category_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('silver_categories')
                field: id
      - name: rule_id
        data_tests: [not_null]
      - name: categorization_source
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [rule, embedding, llm, human]
      - name: categorization_confidence
        data_tests: [not_null]

  - name: silver_split_categories_embedding
    description: >-
      Stage 2 (embedding similarity) of the split-categorization cascade —
      one row per split whose product matched a rule-categorized product by
      cosine similarity above the confidence threshold. Only covers splits
      stage 1 missed entirely.
    columns:
      - name: split_id
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('silver_amazon_splits')
                field: split_id
      - name: category_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('silver_categories')
                field: id
      - name: categorization_source
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [rule, embedding, llm, human]
      - name: categorization_confidence
        data_tests: [not_null]

  - name: silver_split_categories_llm
    description: >-
      Stage 3 (local-LLM fallback) of the split-categorization cascade — one
      row per split whose product a local Ollama chat model classified with
      confidence above the threshold. Only covers products stages 1-2 missed
      entirely.
    columns:
      - name: split_id
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('silver_amazon_splits')
                field: split_id
      - name: category_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('silver_categories')
                field: id
      - name: categorization_source
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [rule, embedding, llm, human]
      - name: categorization_confidence
        data_tests: [not_null]

  - name: silver_split_categories_human
    description: >-
      The human-review stage of the split-categorization cascade —
      corrections recorded via `pf review label --kind split`. The
      highest-priority stage: it can override an earlier stage's assignment,
      not just fill a gap. A split corrected more than once keeps only its
      latest label.
    columns:
      - name: split_id
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('silver_amazon_splits')
                field: split_id
      - name: category_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('silver_categories')
                field: id
      - name: categorization_source
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [rule, embedding, llm, human]
      - name: categorization_confidence
        data_tests: [not_null]

  - name: silver_split_categories_all
    description: >-
      Every split categorized so far, across every split-cascade stage
      (human corrections, then rules + embedding similarity + local-LLM
      fallback) — the split-level analog of silver_transaction_categories_all.
      Absent = not yet categorized by any stage.
    columns:
      - name: split_id
        description: One row per categorized split, across all stages.
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('silver_amazon_splits')
                field: split_id
      - name: category_id
        data_tests: [not_null]
      - name: categorization_source
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [rule, embedding, llm, human]
      - name: categorization_confidence
        data_tests: [not_null]

  - name: silver_categories
    description: Cleaned category taxonomy (one row per category node).
    columns:
      - name: id
        data_tests: [unique, not_null]
      - name: name
        data_tests: [not_null]
      - name: parent_id
        description: Must reference an existing category (replaces the declared FK).
        data_tests:
          - relationships:
              arguments:
                to: ref('silver_categories')
                field: id
