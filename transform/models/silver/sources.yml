version: 2

# The application's entity tables (created by personal_finance.ddl, seeded by
# personal_finance.seed) live in the warehouse's main schema.
sources:
  - name: app
    schema: main
    tables:
      - name: categories
        description: Hierarchical taxonomy seeded from config taxonomy.yaml.
      - name: rules
        description: >-
          Deterministic pattern → category rules seeded from config rules.yaml
          (personal_finance.seed.seed_rules); priority is file order, first
          match wins.
      - name: merchant_aliases
        description: >-
          Deterministic pattern → canonical merchant name seeded from config
          merchants.yaml (personal_finance.seed.seed_merchant_aliases);
          priority is file order, first match wins. Resolves brand variants
          the generic normalize_merchant macro can't.
      - name: merchant_merges
        description: >-
          Human-confirmed (or rejected) merchant-identity merges from the
          embedding-similarity merge-candidate review queue
          (personal_finance.merchant_merge, `pf review merge-candidates` /
          `pf review merge`) — resolves descriptor variants merchants.yaml
          aliases weren't written for. Latest decision per merchant_name
          wins; applied after merchant_aliases in silver_transactions.sql.
      - name: merchant_embeddings
        description: >-
          Cached embedding vector per distinct merchant_name, computed via a
          local Ollama call (personal_finance.embed.compute_missing_embeddings,
          `pf enrich`) and reused across runs.
      - name: merchant_llm_categories
        description: >-
          Cached LLM category choice per distinct merchant_name, computed via
          a local Ollama chat call
          (personal_finance.llm_categorize.compute_missing_llm_categories,
          `pf classify`) and reused across runs.
      - name: product_embeddings
        description: >-
          Cached embedding vector per distinct split product_name, computed
          via a local Ollama call
          (personal_finance.embed.compute_missing_product_embeddings,
          `pf enrich`) and reused across runs. Kept separate from
          merchant_embeddings — a product name and a merchant name are
          different vocabularies.
      - name: product_llm_categories
        description: >-
          Cached LLM category choice per distinct split product_name,
          computed via a local Ollama chat call
          (personal_finance.llm_categorize.compute_missing_product_llm_categories,
          `pf classify`) and reused across runs.
      - name: labels
        description: >-
          Human categorization corrections (personal_finance.review.record_label,
          `pf review label`) — training data for future classifier
          improvements, and the highest-priority categorization stage.
      - name: budgets
        description: >-
          Budget buckets over a category subtree, seeded from config
          budgets.yaml (personal_finance.seed.seed_budgets, `pf init-db`).
          Powers gold_budget_actuals' budget-vs-actual view (Phase 6).

  # Bronze = raw source exports landed as Parquet by dlt (Phase 2). Read as a
  # single config-free glob over every source directory: a new bank/source
  # appears in silver automatically once ingested, no dbt change needed.
  # union_by_name tolerates schema drift (e.g. external_id present only for some
  # sources); DATA_BRONZE_PATH is shared with the app (Settings.data.bronze_path).
  - name: bronze
    description: Raw ingested transactions across every source, landed by dlt.
    tables:
      - name: transactions
        description: Every ingested transaction row, unioned across sources by column name.
        meta:
          external_location: >-
            read_parquet(
              '{{ env_var('DATA_BRONZE_PATH', 'data/bronze') }}/bronze/*/*.parquet',
              union_by_name = true,
              filename = true
            )
      - name: amazon_order_items
        description: >-
          Amazon order-history line items (Retail.OrderHistory.1.csv via
          personal_finance.ingest.amazon_source), landed in its OWN
          bronze_amazon dataset — not bronze/amazon/, which the transactions
          source's bronze/*/*.parquet wildcard would otherwise also sweep up
          and corrupt with NULL-heavy rows, since an order-history row is not
          a transaction (a shipment often groups several item rows under one
          card charge, and its columns share nothing with the generic
          transaction schema). Unlike bank sources, this path is NOT
          auto-discovered by glob: it assumes a single Amazon source
          configured as `name: amazon` in sources.yaml (see
          config/examples/sources.yaml, docs/source-schemas.md). Documented
          here for lineage only — NOT read via the source() macro like
          transactions is: dbt's YAML meta properties render without custom
          project macros in scope, and this
          source needs the read_parquet_or_empty macro (most builds never
          ingest an Amazon file at all) — see stg_amazon_order_items.sql,
          which calls it directly instead.
